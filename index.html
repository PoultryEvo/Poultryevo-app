<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test Firebase</title>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
body{font-family:Arial;padding:2rem;font-size:1.1rem;line-height:1.8}
.ok{color:green;font-weight:bold}
.err{color:red;font-weight:bold}
button{padding:1rem;font-size:1rem;margin-top:1rem;width:100%}
input{padding:0.8rem;font-size:1rem;width:100%;margin-top:0.5rem;box-sizing:border-box}
#result{margin-top:1.5rem;padding:1rem;background:#f0f0f0;border-radius:8px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>

<h2>🧪 Test de connexion Firebase</h2>
<div id="status">Chargement...</div>

<div id="testZone" style="display:none">
  <input type="email" id="email" placeholder="Email" value="rodrigue@poultryevo.cm">
  <input type="password" id="password" placeholder="Mot de passe">
  <button onclick="testLogin()">Tester la connexion</button>
</div>

<div id="result"></div>

<script>
const statusEl = document.getElementById('status');

try {
  if (typeof firebase === 'undefined') {
    statusEl.innerHTML = '<span class="err">❌ ERREUR : le SDK Firebase ne s\'est pas chargé du tout (objet firebase introuvable)</span>';
  } else {
    statusEl.innerHTML = '<span class="ok">✓ SDK Firebase chargé avec succès</span>';

    const firebaseConfig = {
      apiKey: "AIzaSyDkOcDm0eRlPWOS9I1vhs2vCUJBCUxMxos",
      authDomain: "poultryevo-mikouma.firebaseapp.com",
      databaseURL: "https://poultryevo-mikouma-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "poultryevo-mikouma",
      storageBucket: "poultryevo-mikouma.firebasestorage.app",
      messagingSenderId: "1053099773260",
      appId: "1:1053099773260:web:de460c9c170ec6381913e9"
    };

    firebase.initializeApp(firebaseConfig);
    statusEl.innerHTML += '<br><span class="ok">✓ Firebase initialisé avec succès</span>';
    document.getElementById('testZone').style.display = 'block';
  }
} catch (e) {
  statusEl.innerHTML = '<span class="err">❌ ERREUR lors de l\'initialisation : ' + e.message + '</span>';
}

async function testLogin(){
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const resultEl = document.getElementById('result');
  resultEl.textContent = 'Tentative de connexion en cours...';

  try {
    const userCred = await firebase.auth().signInWithEmailAndPassword(email, password);
    resultEl.innerHTML = '<span class="ok">✅ CONNEXION RÉUSSIE !</span>\n\nUtilisateur : ' + userCred.user.email + '\nUID : ' + userCred.user.uid;
  } catch (e) {
    resultEl.innerHTML = '<span class="err">❌ ÉCHEC DE CONNEXION</span>\n\nCode erreur : ' + e.code + '\nMessage : ' + e.message;
  }
}
</script>

</body>
</html>
